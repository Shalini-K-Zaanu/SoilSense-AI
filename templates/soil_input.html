<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Soil Analysis | SoilSense AI</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            background: linear-gradient(
                135deg,
                #e8f5e9,
                #f5fff6
            );

            color: #183b25;

            padding: 30px 15px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            margin: auto;
        }

        .back {
            display: inline-block;
            text-decoration: none;
            color: #287a45;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            padding: 35px;

            border-radius: 22px;

            box-shadow:
                0 10px 35px
                rgba(30, 90, 50, 0.12);
        }

        h1 {
            color: #125c32;
            margin-bottom: 8px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #6b7d70;
            margin-bottom: 30px;
        }

        .error {
            background: #ffe5e5;
            color: #b00020;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #315c3d;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            display: block;

            padding: 13px;

            border: 1.5px solid #b8dfc2;

            border-radius: 10px;

            font-size: 15px;

            outline: none;

            background: white;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #55a96b;
        }

        #analyzeBtn {
            width: 100%;

            border: none;

            padding: 15px;

            border-radius: 12px;

            background: linear-gradient(
                90deg,
                #15783d,
                #35a85c
            );

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 10px;

            transition: all 0.3s ease;
        }

        #analyzeBtn:hover {
            transform: translateY(-3px);

            box-shadow:
                0 8px 20px
                rgba(21, 120, 61, 0.25);
        }

        #analyzeBtn:disabled {
            opacity: 0.85;
            cursor: wait;
        }

    </style>

</head>


<body>


<div class="container">


    <a href="{{ url_for('dashboard') }}"
       class="back">

        ← Back to Dashboard

    </a>


    <div class="card">


        <h1>🌱 Soil Analysis</h1>

        <p class="subtitle">
            Enter your soil details to analyze its nutrient levels.
        </p>


        {% if error %}

        <div class="error">

            {{ error }}

        </div>

        {% endif %}


        <form id="soilForm"
              method="POST"
              action="{{ url_for('soil_input') }}">


            <!-- TEMPERATURE -->

            <div class="form-group">

                <label>
                    🌡️ Temperature (°C)
                </label>

                <input
                    type="number"
                    step="any"
                    name="temperature"
                    required
                >

            </div>


            <!-- HUMIDITY -->

            <div class="form-group">

                <label>
                    💧 Humidity (%)
                </label>

                <input
                    type="number"
                    step="any"
                    name="humidity"
                    required
                >

            </div>


            <!-- PH -->

            <div class="form-group">

                <label>
                    ⚗️ Soil pH
                </label>

                <input
                    type="number"
                    step="any"
                    name="ph"
                    required
                >

            </div>


            <!-- SOIL MOISTURE -->

            <div class="form-group">

                <label>
                    💦 Soil Moisture (%)
                </label>

                <input
                    type="number"
                    step="any"
                    name="soil_moisture"
                    required
                >

            </div>


            <!-- ORGANIC MATTER -->

            <div class="form-group">

                <label>
                    🌾 Organic Matter (%)
                </label>

                <input
                    type="number"
                    step="any"
                    name="organic_matter"
                    required
                >

            </div>


            <!-- SOIL TYPE -->

            <div class="form-group">

                <label>
                    🌍 Soil Type
                </label>

                <select name="soil_type" required>

                    <option value="">
                        Select Soil Type
                    </option>

                    <option value="Alluvial">
                        Alluvial
                    </option>

                    <option value="Black">
                        Black
                    </option>

                    <option value="Clay">
                        Clay
                    </option>

                    <option value="Loamy">
                        Loamy
                    </option>

                    <option value="Red">
                        Red
                    </option>

                    <option value="Sandy">
                        Sandy
                    </option>

                </select>

            </div>


            <!-- NITROGEN -->

            <div class="form-group">

                <label>
                    🌿 Nitrogen (N) (mg/kg)
                </label>

                <input
                    type="number"
                    step="any"
                    name="nitrogen"
                    required
                >

            </div>


            <!-- PHOSPHORUS -->

            <div class="form-group">

                <label>
                    🌱 Phosphorus (P) (mg/kg)
                </label>

                <input
                    type="number"
                    step="any"
                    name="phosphorus"
                    required
                >

            </div>


            <!-- POTASSIUM -->

            <div class="form-group">

                <label>
                    🍃 Potassium (K) (mg/kg)
                </label>

                <input
                    type="number"
                    step="any"
                    name="potassium"
                    required
                >

            </div>


            <!-- ANALYZE BUTTON -->

            <button
                type="submit"
                id="analyzeBtn">

                Analyze Soil

            </button>


        </form>


    </div>


</div>


<script>

document.getElementById("soilForm").addEventListener("submit", function () {

    const button =
        document.getElementById("analyzeBtn");

    button.innerHTML =
        "Analyzing Soil... ⏳";

    button.disabled = true;

});

</script>


</body>

</html>
